name: SOUL Integration CI - JEV
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate SOUL identity
        run: test -s SOUL_ECOSYSTEM.md
      - name: Validate submodules
        shell: bash
        run: |
          set -e
          if test -f .gitmodules; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read p; do test -e "$p"; done
          fi
      - name: Validate 25-source registry
        if: github.event.repository.name == 'jev-api'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/soul-25-augmentation.json'))
          assert len(d['external_providers']) == 25
          for x in d['external_providers']:
              assert x['source'].startswith('https://github.com/')
              assert x['revision'] and x['meshTargets']
          print('25/25 external capability sources: VALID')
          PY

      - name: Validate JEV capability fabric
        run: node scripts/jev-capability-fabric.test.mjs
